name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc gcc-multilib binutils

      - name: Build (clean)
        run: |
          make clean
          make

      - name: Run host-side regression tests
        run: make test
